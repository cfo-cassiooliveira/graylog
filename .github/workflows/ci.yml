# CI do Graylog do Workspace (Art. V; ordem do testing-quality.md; varreduras do security.md).
# Projeto de infraestrutura: sem build de aplicação; o "teste" é o smoke test ponta a ponta com a stack de pé.
name: ci

on:
  push:
    branches: [master, 'DEV-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" -S warning scripts/*.sh provisioning/*.sh

  secrets:
    name: gitleaks (segredos em todo o histórico)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --no-banner --redact --exit-code 1

  trivy:
    name: Trivy (misconfig do compose/Dockerfile e segredos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: >-
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --scanners misconfig,secret
          --severity HIGH,CRITICAL --skip-version-check --exit-code 1 /src

  smoke:
    name: stack + provisionamento + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [shellcheck]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # O OpenSearch exige vm.max_map_count >= 262144.
      - run: sudo sysctl -w vm.max_map_count=262144
      - run: ./scripts/generate-env.sh
      - run: docker compose up -d --build --wait graylog
      - name: Provisionamento (duas vezes, prova a idempotência)
        run: docker compose run --rm provisioner && docker compose run --rm provisioner
      - run: docker compose run --rm -T -v "$PWD/scripts:/scripts:ro" --entrypoint /scripts/smoke-test.sh provisioner
      - name: Logs em caso de falha
        if: failure()
        run: for service in graylog opensearch mongodb; do docker compose logs --no-color --tail 120 "$service"; done
